name = "ke-assistant"
main = "src/worker-v3.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Valores NO secretos. Los secretos van con `npx wrangler secret put <NOMBRE>`:
#   LLM_PROVIDER   → deepseek | openai | anthropic
#   LLM_API_KEY    → API key del proveedor elegido
#   SHARED_SECRET  → cadena larga aleatoria; la misma en el userscript y el rule-editor
#   GITHUB_TOKEN   → fine-grained PAT, Contents: read/write, solo el repo de la KB
[vars]
GITHUB_OWNER = "Juan9201"
GITHUB_REPO = "KE-AI-Rules"
GITHUB_BRANCH = "main"
KB_ROOT = ""                            # "" si kb/ es la raíz del repo; "kb" si subiste todo el proyecto
LLM_MODEL = ""                          # "" = modelo por defecto del proveedor
LLM_BASE_URL = ""                       # "" = URL por defecto del proveedor
ALLOWED_ORIGINS = "*"                   # la auth real es SHARED_SECRET; restringe si hosteas el editor
